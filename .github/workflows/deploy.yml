# SPEC-0019. Every push to main is a merged release PR, and puts that release on
# the VPS. Tests are not run again here: main only takes a release PR whose
# checks are green (docs/process/branching-and-releases.md, rule 4).
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancelled: a deploy stopped between the rebuild and the migration
# leaves the new code running against the old schema.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check the deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_FINGERPRINT VPS_PROJECT_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy over SSH
        # v1.2.0, pinned by commit: this step holds the deploy key.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          SHA: ${{ github.sha }}
          PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A host presenting another key is refused before any command runs.
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: SHA,PROJECT_PATH
          command_timeout: 25m
          # POSIX sh: the remote login shell is not guaranteed to be bash.
          script: |
            set -eu
            case "$PROJECT_PATH" in "~"*) PROJECT_PATH="$HOME${PROJECT_PATH#\~}" ;; esac
            cd "$PROJECT_PATH"

            # A dev demo left in the directory is discarded: main retakes it.
            # .env.prod is ignored by git, so neither command touches it.
            git fetch origin
            git checkout -f main
            git reset --hard origin/main
            tag="$(git describe --tags --exact-match 2>/dev/null || true)"
            echo "deploying $(git rev-parse HEAD) ${tag:-untagged} (pushed: $SHA)"

            if [ ! -f .env.prod ]; then
              echo ".env.prod is missing in $PROJECT_PATH; see docs/process/deploy-vps.md" >&2
              exit 1
            fi
            dc="docker compose -f docker-compose.prod.yml --env-file .env.prod"

            $dc up -d --build
            # As the owner role: env.py reads DATABASE_URL_ADMIN.
            $dc exec -T backend alembic upgrade head

            healthy=0
            i=0
            while [ "$i" -lt 30 ]; do
              if $dc exec -T backend python -c "import json,sys,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=2); sys.exit(0 if r.status == 200 and json.load(r).get('status') == 'ok' else 1)" 2>/dev/null; then
                healthy=1
                break
              fi
              i=$((i + 1))
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              echo "the API did not answer /health within 60 seconds" >&2
              $dc logs --tail=50 backend >&2
              exit 1
            fi

            docker image prune -f
            echo "deployed $(git rev-parse HEAD) ${tag:-untagged}"
