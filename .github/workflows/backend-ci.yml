name: backend-ci

on:
  # No branch filter on pull_request: the filter matches the *target* branch, so
  # a stacked PR — one opened against another feature branch — would run nothing
  # at all, and get reviewed with no recorded result. push stays on dev and main,
  # which are the only branches that take commits directly.
  pull_request:
  push:
    branches: [dev, main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# Superseded runs on the same branch are cancelled, but never on dev/main —
# every commit on an integration branch keeps its own recorded result.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  # Decides what the rest has to test. A job with nothing to test is skipped,
  # and GitHub counts a skipped job as passed, so a required check never hangs
  # on a PR that only changes documentation.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      tests: ${{ steps.diff.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          # No usable base (a new branch, a force push): test everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="$(printf 'frontend/\nbackend/\n')"
          else
            files="$(git diff --name-only "$base" HEAD)"
          fi
          if echo "$files" | grep -qE '^(backend/|scripts/|infra/|\.pre-commit-config\.yaml$|\.github/workflows/backend-ci\.yml$)'; then echo "backend=true"; else echo "backend=false"; fi >> "$GITHUB_OUTPUT"
          # What a PR runs: the test files it changed and that still exist. A
          # change to the shared fixtures, or no usable base, runs them all.
          if echo "$files" | grep -qE '^backend/(tests/(conftest|catalogue|__init__)\.py)?$'; then
            tests="tests"
          else
            tests="$(echo "$files" | grep -E '^backend/tests/test_[A-Za-z0-9_]+\.py$' | sed 's#^backend/##' | while read -r f; do [ -f "backend/$f" ] && printf '%s ' "$f"; done)"
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend lint and tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Pinned deliberately. setup-python's poetry cache parses the output of
      # `poetry config --list` line by line; a future Poetry that prints one
      # unparseable value would break the *cache* step, which is a confusing
      # thing to debug on somebody else's pull request.
      POETRY_VERSION: 2.3.3

    steps:
      - uses: actions/checkout@v5

      # Before setup-python on purpose: `cache: poetry` shells out to
      # `poetry config --list` to work out what to cache, so Poetry has to be
      # resolvable by then.
      - name: Install Poetry
        working-directory: .
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      # Together these are what `uv sync --locked` used to guarantee:
      # `check --lock` fails when the lock is missing, and `sync` refuses a lock
      # that is stale relative to pyproject.toml rather than re-resolving in
      # silence. `sync` and not `install` because the environment is restored
      # from a cache — anything the lock no longer names has to be pruned.
      - name: Validate pyproject and lock
        run: poetry check --lock

      - name: Install dependencies
        run: poetry sync --all-groups

      - name: Ruff — lint
        run: poetry run ruff check .

      - name: Ruff — format
        run: poetry run ruff format --check .

      # The pre-commit hook's twin, for a commit that skipped the hook
      # (docs/process/coding-standards.md §7).
      - name: Constants in app/constants
        run: python ../scripts/check_constants.py

      # definition-of-done requires a clean mypy run. It was in the checklist
      # before it was in the pipeline, which is how a checklist stops being one.
      - name: mypy
        # `migrations` is included on purpose: it is where the hand-written DDL
        # lives, which is the code least covered by tests and most able to
        # destroy data.
        run: poetry run mypy app migrations tests

      # A PR runs only the test files it changed: the whole suite takes about
      # thirteen minutes, and GitHub minutes are paid for. Coverage is not
      # measured there, because a part of the suite cannot reach the floor.
      - name: Tests of the files the PR changed
        if: github.event_name == 'pull_request' && needs.changes.outputs.tests != ''
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: poetry run pytest $TESTS

      # The whole suite and the 70% floor (RNF10) run on dev and main. Tests use
      # a real PostgreSQL via testcontainers; the runner already provides Docker.
      - name: Tests with coverage
        if: github.event_name != 'pull_request'
        run: poetry run pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  segredos:
    name: Secret scan
    runs-on: ubuntu-latest
    # Its own job rather than a step in `backend`: this scans the whole
    # repository, not the backend, and a lint failure must not stop it from
    # reporting. `threat-model.md` has asked for this in three separate
    # paragraphs and `roadmap.md` puts it in M1; OQ-17 is the live prototype
    # token it exists to catch.
    #
    # The commit hook in .pre-commit-config.yaml is the local half and knows
    # what a CPF and a SIAPE number are, which gitleaks does not. gitleaks is
    # the half that knows what an API key looks like. Neither replaces the
    # other, and only this one runs on code that arrives from outside.
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, not just the working tree, so it needs one.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
