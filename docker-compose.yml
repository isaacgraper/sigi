services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigi}
      POSTGRES_DB: ${POSTGRES_DB:-sigi}
      TZ: ${TZ:-America/Sao_Paulo}
      # Consumed by ./infra/postgres/init/01-papeis.sh. Two roles, because
      # ADR-0004's append-only guarantee is void if the application connects
      # as the table owner. See that script for the reasoning.
      APP_DB_ROLE: ${APP_DB_ROLE:-sigi_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-too}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when postgres_data is empty. An existing volume keeps its
      # roles, so `docker compose up` on an old volume will fail the migration
      # with SI003 rather than silently running single-role.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigi} -d ${POSTGRES_DB:-sigi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # The application runs as the restricted role.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sigi_app:change-me-too@db:5432/sigi}
      # Alembic only. Never used to serve a request.
      DATABASE_URL_ADMIN: ${DATABASE_URL_ADMIN:-postgresql+psycopg://sigi:sigi@db:5432/sigi}
      APP_ENV: ${APP_ENV:-development}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
