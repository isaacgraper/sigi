[project]
name = "sigi-backend"
version = "0.1.0"
description = "SIGI — Sistema Integrado de Governança de Insumos (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # SPEC-0001. Justification lives in the spec's Implementation plan section;
    # CLAUDE.md forbids a new dependency without one.
    "bcrypt>=4.2",          # AC-0001-05 pins the algorithm and cost
    "pyjwt[crypto]>=2.10",  # AC-0001-09 RS256; AC-0001-20 verifies the provider's token
    "httpx2>=2.12",         # OIDC token exchange and JWKS retrieval (ADR-0010)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",           # definition-of-done requires a clean run
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
